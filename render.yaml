services:
  - type: web
    name: duospeak
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm run db:push:prod -w apps/api && npm run db:seed -w apps/api
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: duospeak-db
          property: connectionString

databases:
  - name: duospeak-db
    plan: free
