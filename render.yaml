services:
  - type: web
    name: duospeak
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm run db:push:prod -w apps/api && npm run db:seed -w apps/api
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # DATABASE_URL est saisie manuellement dans le dashboard Render
      # (base Neon, sans expiration). sync:false empêche le blueprint de l'écraser.
      - key: DATABASE_URL
        sync: false
